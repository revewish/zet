<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>هروب البطاطسايه</title><style>

#ov h1{margin:0 0 8px;font-size:clamp(26px,6vmin,48px)}#ov p{font-size:clamp(15px,3.2vmin,22px);line-height:1.7;max-width:520px;margin:0 auto 18px}
#go,#gs{width:auto;height:auto;border-radius:30px;padding:14px 38px;font-size:22px;background:#ffb300;color:#3a2200;font-weight:800;border:0}#gs{background:#fff3;color:#fff;border:2px solid #fff8}#lg{display:none;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px;direction:ltr}#lg button{width:auto;height:auto;border-radius:12px;padding:9px 0;font-size:18px;font-weight:800;background:#ffb30044;border:2px solid #ffb300}#ov{touch-action:pan-y}#ov>div{max-height:100%;overflow:auto}#mn{width:44px;height:44px;font-size:20px;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;border-radius:14px}

<canvas id="c"></canvas><div id="hud"></div><div id="tt"></div>
<div id="ctl"><div><button id="L">◀</button><button id="R">▶</button></div><button id="J">⬆</button></div>
<button id="mn">☰</button><div id="ov"><div><h1>🥔 هروب البطاطسايه</h1><p id="op">امشي يمين وشمال وانط بالزرار. اعدّي على المبشرة تبقى فرايز 🍟 وبعدين ادخل طاسة الزيت. 10 لفلات وعقبات المطبخ مستنياك.</p><button id="go">يلا نبدأ</button> <button id="gs">المراحل</button><div id="lg"></div></div></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),H=450,G=360,tt=document.getElementById('tt');
let VW=800,sc=1,L,lv=1,deaths=0,t=0,cam=0,go=0,obs=[],P=null,gx,pnx,shake=0,parts=[],mt,wt=0;
const K=['knife','pin','fork','flame','tomato','chaser','salt','spoon','lid','cat'];

const DM=['اتقطعت يا معلم!','اتحرقت!','ده مطبخ مش ملاهي!','حاولي ثاني البطاطس مش بتستسلم','الله يسامحك يكيندا ركّزي شوية'];
const keys={l:0,r:0,j:0};
function msg(s,d){tt.textContent=s;tt.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>tt.style.opacity=0,d||2600)}
function hud(){document.getElementById('hud').textContent='اللفل '+lv+'/30 · موتات: '+deaths}
function fit(){const iw=innerWidth,ih=innerHeight,d=Math.min(devicePixelRatio||1,2);let h=iw<ih?Math.min(ih*.5,iw*1.1):ih,w=iw<ih?iw:Math.min(iw,h*16/9);VW=H*w/h;cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*d;cv.height=h*d;sc=cv.height/H}
addEventListener('resize',fit);fit();
function load(n){lv=n;const m=1+Math.floor((n-1)*9/29),av=UN.filter(u=>u<=n).length,nw=UN.indexOf(n);L=1400+m*170+n*25;gx=Math.round(L*.42);pnx=L-170;t=0;obs=[];parts=[];const a=320,b=L-330;
 for(let i=0;i<m;i++){let x=a+(i+.5)*(b-a)/m;if(Math.abs(x-gx)<120)x+=x<gx?-120:120;obs.push({k:K[i==0&&nw>=0?nw:(i*7+n)%av],x,p:Math.random()*6,y:0,d:0,r:0})}
 P={x:80,y:G,vx:0,vy:0,f:1,on:1,s:'p',dead:0,win:0,co:0,jb:0};hud();msg('مرحلة '+n+': '+(nw>=0?IN[nw]:GEN[n%5]),3200)}
function R(o){const x=o.x,p=o.p;switch(o.k){
case'knife':{const y=50+(Math.sin(t*2.2+p)+1)/2*(G-50);return[x-15,y-95,x+15,y]}
case'pin':{const c=x+Math.sin(t*1.3+p)*110;return[c-38,G-30,c+38,G]}
case'fork':{const h=Math.max(0,Math.sin(t*2.5+p))*85;return h>12?[x-17,G-h,x+17,G]:null}
case'flame':return Math.sin(t*1.8+p)>-.2?[x-20,G-60,x+20,G]:null
case'tomato':{const c=x+Math.sin(t*1.1+p)*90,y=G-18-Math.abs(Math.sin(t*3+p))*75;return[c-15,y-15,c+15,y+15]}
case'chaser':{const c=-150+Math.max(0,t-2.5)*135;return[c-22,G-44,c+22,G]}
case'salt':return o.d==1?[x-14,o.y-42,x+14,o.y]:null
case'spoon':{const y=G-78+Math.sin(t*2+p)*34;return[x-20,y-20,x+20,y+20]}
case'lid':{const c=x+300-(t*240+p*100)%600;return[c-30,G-24,c+30,G]}
case'cat':{const l=Math.max(0,Math.sin(t*1.6+p))*115;return l>8?[x+40-l,G-34,x+50,G-8]:null}}}
function burst(x,y,c){for(let i=0;i<16;i++)parts.push({x,y,vx:(Math.random()-.5)*360,vy:-Math.random()*320,l:.9,c})}
function die(){P.dead=1;shake=.4;burst(P.x,P.y-25,'#ecc98a');deaths++;hud();msg(DM[Math.random()*5|0],1100)}
function upd(dt){
 if(P.dead){P.dead-=dt;if(P.dead<=0)load(lv);return}
 if(P.win){P.win-=dt;if(P.win<=0){if(lv<30)load(lv+1);else fin()}return}
 t+=dt;const d=keys.r-keys.l;P.vx+=(d*235-P.vx)*Math.min(1,dt*14);if(d)P.f=d;
 P.jb-=dt;P.co=P.on?.1:P.co-dt;if(P.jb>0&&P.co>0){P.vy=-650;P.co=0;P.jb=0}
 P.x+=P.vx*dt;const mx=P.s=='p'?pnx-30:pnx+80;
 if(P.x>=mx&&P.s=='p'&&d>0&&performance.now()>wt){wt=performance.now()+2500;msg('لازم تعدّي على المبشرة الأول يا بطل!')}
 P.x=Math.max(22,Math.min(mx,P.x));P.vy+=1800*dt;P.y+=P.vy*dt;if(P.y>=G){P.y=G;P.vy=0;P.on=1}else P.on=0;
 if(P.s=='p'&&Math.abs(P.x-gx)<36){P.s='f';burst(gx,G-60,'#ffd54f');shake=.3;msg('اتبشرت يا معلم! بقيت بطاطططسس 🍟')}
 for(const o of obs)if(o.k=='salt'){if(!o.d&&Math.abs(P.x-o.x)<190){o.d=1;o.y=-30}
  if(o.d==1){o.y+=650*dt;if(o.y>G){o.d=2;o.r=1.2}}else if(o.d==2){o.r-=dt;if(o.r<=0)o.d=0}}
 const b=[P.x-12,P.y-46,P.x+12,P.y-3];
 for(const o of obs){const r=R(o);if(r&&b[0]<r[2]&&b[2]>r[0]&&b[1]<r[3]&&b[3]>r[1]){die();return}}
 if(P.s=='f'&&P.x>pnx+40){P.win=1.6;burst(pnx+70,G-30,'#ffb300');msg(lv<30?'فرايز دهب! اللفل اللي بعده 🔥':'خلصت المطبخ كله!',1500)}}
function fin(){const o=document.getElementById('ov');document.getElementById('op').textContent='خلصت الـ30 مرحلة بـ '+deaths+' موتة. المطبخ كله بقى تحت إيدك 🏆';document.getElementById('go').textContent='العب تاني';o.style.display='flex';go=0;lv=1;deaths=0}
function em(e,x,y,s,r){cx.save();cx.translate(x,y);if(r)cx.rotate(r);cx.font=s+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(e,0,0);cx.restore()}

function bg(){cx.fillStyle='#f3e3c3';cx.fillRect(0,0,VW,G);cx.strokeStyle='#0001';cx.lineWidth=2;const o=-(cam*.3)%60;
 for(let x=o;x<VW;x+=60){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,G);cx.stroke()}
 for(let y=0;y<G;y+=60){cx.beginPath();cx.moveTo(0,y);cx.lineTo(VW,y);cx.stroke()}
 {const wx=((420-cam*.15)%1100+1100)%1100-150;rr(wx-6,14,132,102,6,'#8d5a34');const sg=cx.createLinearGradient(0,20,0,110);sg.addColorStop(0,'#81d4fa');sg.addColorStop(1,'#e1f5fe');cx.fillStyle=sg;cx.fillRect(wx,20,120,90);em('☀️',wx+88,48,30);em('☁️',wx+40,62,30);cx.fillStyle='#8d5a34';cx.fillRect(wx+57,20,6,90);cx.fillRect(wx,62,120,5);rr(wx-10,14,22,100,6,'#e57373');rr(wx+108,14,22,100,6,'#e57373')}
 cx.fillStyle='#555';cx.fillRect(0,34,VW,3);const hg=['🍳','🫖','🥘'];for(let i=0;i<10;i++)em(hg[i%3],((i*190-cam*.25)%1900+1900)%1900-40,62,34);
 cx.fillStyle='#8d5a34';cx.fillRect(0,130,VW,10);cx.fillStyle='#0002';cx.fillRect(0,140,VW,5);const it=['🫙','🍯','☕','🥘','🧅','🍳'];
 for(let i=0;i<12;i++){const x=((i*150-cam*.3)%1800+1800)%1800-60;em(it[i%6],x,108,38)}
 cx.fillStyle='#b77b45';cx.fillRect(0,G,VW,H-G);cx.fillStyle='#d9a066';cx.fillRect(0,G,VW,8);
 for(let r=0;r<2;r++)for(let x=-(cam%44)-44;x<VW;x+=22){const k=Math.round((x+cam)/22);cx.fillStyle=(k+r)%2?'#fff':'#d84343';cx.fillRect(x,G+8+r*22,22,22)}

 for(let x=-(cam%140);x<VW;x+=140){cx.beginPath();cx.moveTo(x,G+58);cx.lineTo(x,H);cx.stroke()}}
function gr(x0,y0,x1,y1,a,b,c){const g=cx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);if(c)g.addColorStop(.5,c);g.addColorStop(1,b);return g}
function dot(x,y,r,c){cx.fillStyle=c;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function fl(x,y,s,h,c){cx.fillStyle=c;cx.beginPath();cx.moveTo(x-s,y);cx.bezierCurveTo(x-s*1.2,y-h*.4,x-s*.3,y-h*.6,x+Math.sin(t*14)*3,y-h);cx.bezierCurveTo(x+s*.3,y-h*.6,x+s*1.2,y-h*.4,x+s,y);cx.closePath();cx.fill()}
function shk(x,y,rot){cx.save();cx.translate(x,y);cx.rotate(rot);rr(-11,-30,22,32,7,'rgba(220,240,255,.85)');cx.fillStyle='#fff';cx.fillRect(-9,-18,18,18);rr(-12,-38,24,10,4,gr(-12,0,12,0,'#eceff1','#78909c'));for(const i of[-5,0,5])dot(i,-33,1.3,'#455a64');cx.restore()}
function dO(o){const r=R(o),x=o.x,p=o.p;switch(o.k){
case'knife':{const y=r[3];rr(x-9,y-175,18,82,7,gr(x-9,0,x+9,0,'#3e2410','#8a5a2f','#6b4423'));dot(x,y-160,2.2,'#d4af37');dot(x,y-135,2.2,'#d4af37');dot(x,y-110,2.2,'#d4af37');rr(x-13,y-97,26,8,2,'#9aa5ab');
 cx.fillStyle=gr(x-14,0,x+14,0,'#eceff1','#90a4ae','#cfd8dc');cx.beginPath();cx.moveTo(x-13,y-90);cx.lineTo(x+13,y-90);cx.lineTo(x+13,y-32);cx.quadraticCurveTo(x+9,y-6,x-13,y);cx.closePath();cx.fill();cx.fillStyle='#fffa';cx.fillRect(x-9,y-84,3,56);break}
case'pin':{const c=(r[0]+r[2])/2;rr(c-58,G-22,22,12,6,'#8b5a2b');rr(c+36,G-22,22,12,6,'#8b5a2b');rr(c-40,G-32,80,32,14,gr(0,G-32,0,G,'#f0c98a','#b98440','#d9a066'));cx.fillStyle='#8b5a2b55';for(let i=0;i<4;i++)cx.fillRect(c-34+(i*19+t*70)%68,G-27,3,22);rr(c-34,G-29,68,4,2,'#fff5');break}
case'fork':{rr(x-20,G-7,40,7,3,'#607d8b');if(r){rr(x-16,r[1]+14,32,6,3,'#b0bec5');for(let i=0;i<3;i++)rr(x-15+i*12,r[1],6,G-r[1],3,gr(x-15+i*12,0,x-9+i*12,0,'#eceff1','#78909c'))}break}
case'flame':{rr(x-28,G-9,56,9,4,'#37474f');if(r){const k=1+Math.sin(t*20+p)*.06;fl(x,G-8,24*k,66,'#e53935');fl(x,G-8,16*k,48,'#ff9800');fl(x,G-8,8*k,28,'#ffee58')}else for(const i of[-20,-10,0,10,20])dot(x+i,G-12,2.5,'#4fc3f7');break}
case'tomato':{const a=(r[0]+r[2])/2,b=(r[1]+r[3])/2;cx.fillStyle='#0003';cx.beginPath();cx.ellipse(a,G+3,16-(G-b)/12,4,0,0,7);cx.fill();
 const g=cx.createRadialGradient(a-5,b-6,2,a,b,19);g.addColorStop(0,'#ff8a80');g.addColorStop(1,'#c62828');cx.fillStyle=g;cx.beginPath();cx.arc(a,b,17,0,7);cx.fill();
 cx.fillStyle='#43a047';for(const i of[-1,1]){cx.beginPath();cx.ellipse(a+i*5,b-15,6,3,i*.4,0,7);cx.fill()}rr(a-1.5,b-22,3,8,1,'#2e7d32');cx.fillStyle='#fff7';cx.beginPath();cx.ellipse(a-6,b-6,4,2.5,-.6,0,7);cx.fill();break}
case'chaser':{const c=(r[0]+r[2])/2,s=Math.sin(t*18)*9;cx.strokeStyle='#37474f';cx.lineWidth=4;cx.lineCap='round';for(const i of[-8,8]){const a=s*(i/8);cx.beginPath();cx.moveTo(c+i,G-26);cx.lineTo(c+i+a,G-4);cx.stroke();dot(c+i+a+3,G-3,4,'#d32f2f')}
 rr(c-40,G-45,28,15,6,gr(0,G-45,0,G-30,'#8a5a2f','#4e2f16'));dot(c-34,G-38,1.8,'#d4af37');dot(c-22,G-38,1.8,'#d4af37');
 cx.fillStyle=gr(0,G-48,0,G-24,'#eceff1','#90a4ae');cx.beginPath();cx.moveTo(c-12,G-47);cx.lineTo(c+24,G-47);cx.lineTo(c+38,G-26);cx.quadraticCurveTo(c+8,G-22,c-12,G-26);cx.closePath();cx.fill();
 dot(c+8,G-38,5,'#fff');dot(c+10,G-37,2.4,'#c62828');cx.strokeStyle='#222';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(c+2,G-46);cx.lineTo(c+14,G-41);cx.stroke();break}
case'salt':if(o.d==1){cx.fillStyle='#0003';cx.beginPath();cx.ellipse(x,G+4,16,5,0,0,7);cx.fill();shk(x,o.y-40,Math.PI+Math.sin(t*10)*.2);cx.fillStyle='#fff';for(let i=0;i<4;i++)cx.fillRect(x-5+i*3,o.y-2+(t*300+i*9)%14,2,3)}else if(o.d==2){shk(x+4,G-12,1.6);cx.fillStyle='#fff';cx.beginPath();cx.ellipse(x+30,G-3,16,5,0,0,7);cx.fill()}break
case'spoon':{const b=(r[1]+r[3])/2;cx.save();cx.translate(x,b);cx.rotate(t*6);rr(-3.5,-4,7,34,3,'#b5733a');cx.fillStyle='#c68642';cx.beginPath();cx.ellipse(0,-14,11,16,0,0,7);cx.fill();cx.fillStyle='#a0612b';cx.beginPath();cx.ellipse(0,-14,7,11,0,0,7);cx.fill();cx.restore();break}
case'lid':{const c=(r[0]+r[2])/2;cx.fillStyle='#0002';cx.beginPath();cx.ellipse(c,G+2,36,4,0,0,7);cx.fill();cx.fillStyle=gr(0,G-24,0,G,'#eceff1','#78909c');cx.beginPath();cx.ellipse(c,G-6,34,18,0,Math.PI,0);cx.fill();rr(c-36,G-8,72,8,4,'#607d8b');rr(c-6,G-30,12,8,4,'#37474f');cx.strokeStyle='#fff9';cx.lineWidth=2;cx.beginPath();cx.arc(c,G-6,24,Math.PI*1.15,Math.PI*1.4);cx.stroke();break}
case'cat':{const bx=x+78,hx=x+58,sw=Math.sin(t*3)*6;cx.strokeStyle='#e68900';cx.lineWidth=8;cx.lineCap='round';cx.beginPath();cx.moveTo(bx+22,G-12);cx.quadraticCurveTo(bx+50,G-20,bx+40+sw,G-60);cx.stroke();
 cx.fillStyle=gr(0,G-84,0,G,'#ffb74d','#f57c00');cx.beginPath();cx.ellipse(bx,G-28,28,28,0,0,7);cx.fill();cx.beginPath();cx.ellipse(hx,G-62,22,19,0,0,7);cx.fill();
 cx.beginPath();cx.moveTo(hx-20,G-70);cx.lineTo(hx-16,G-92);cx.lineTo(hx-3,G-77);cx.fill();cx.beginPath();cx.moveTo(hx+4,G-77);cx.lineTo(hx+16,G-92);cx.lineTo(hx+20,G-68);cx.fill();
 for(const i of[-9,6]){dot(hx+i,G-64,5,'#c5e1a5');cx.fillStyle='#111';cx.fillRect(hx+i-1,G-69,2,10)}dot(hx-2,G-57,2.5,'#e91e63');
 cx.strokeStyle='#5d3a1a';cx.lineWidth=1.5;for(const i of[-1,1]){cx.beginPath();cx.moveTo(hx-2+i*6,G-55);cx.lineTo(hx-2+i*24,G-58+i*2);cx.moveTo(hx-2+i*6,G-53);cx.lineTo(hx-2+i*24,G-50);cx.stroke()}
 if(r){rr(r[0],r[1],r[2]-r[0],24,12,'#ffa726');dot(r[0]+10,r[1]+12,10,'#ffb74d');dot(r[0]+10,r[1]+12,5,'#f48fb1')}break}}}
function eyes(fx,y,mv,f,bl){for(const i of[-1,1]){cx.fillStyle='#fff';cx.beginPath();cx.ellipse(i*7+fx,y,5.5,bl?1:6.5,0,0,7);cx.fill();if(!bl){cx.fillStyle='#222';cx.beginPath();cx.arc(i*7+fx+(mv?f*2.5:0),y+1,2.6,0,7);cx.fill()}}
 cx.strokeStyle='#6b3b1a';cx.lineWidth=2;cx.beginPath();cx.arc(fx,y+9,5,.2,Math.PI-.2);cx.stroke()}
function dP(){if(P.dead)return;const{x,y,f,s}=P,mv=Math.abs(P.vx)>20&&P.on,w=mv?Math.sin(t*18):0;cx.save();cx.translate(x,y);cx.fillStyle='#0003';cx.beginPath();cx.ellipse(0,2,s=='p'?20:26,5,0,0,7);cx.fill();
